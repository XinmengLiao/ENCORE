path:
    root: output
    scratch: scratch
    scripts: ../Scripts
    gtdbtk: [path/to/gtdbtk_release]
folder:
    logs: logs
    benchmarks: benchmarks
    quality: fastqc
    qfiltered: qfiltered
    assemblies: assemblies
    crossMap: crossMap 
    concoct: concoct
    maxbin: maxbin
    metabat: metabat
    refined: refined_bins
    reassembled: reassembled_bins
    classification: GTDBTk
    abundance: abundance
    proteinBins: protein_bins
    dnaBins: dna_bins
    GEMs: GEMs
    ecGEMs: ecGEMs
    fva: fva
    stats: stats
    reporter: reporter_metabolite
DataforScripts:
    carveme: ../Scripts/DataforScripts/media_db.tsv
    UniprotID: ../Scripts/DataforScripts/UniprotID.txt
    kegg: ../Scripts/DataforScripts/kegglist.txt
PythonScripts:
    adjust_coverage: ../Scripts/PythonScripts/adjust_coverage.py
MatlabScripts:
    makeECGEM: ../Scripts/MATLABScripts/meta-gecko.m
    extractMet: ../Scripts/MATLABScripts/meta-gecko-extractMet.m
    adaptertemplate: ../Scripts/MATLABScripts/adapterTemplate.m
Rscripts:
    modelVis: ../Scripts/RScripts/modelVis.R
    taxonomy: ../Scripts/RScripts/taxonomy.R
    DAA_RM: ../Scripts/RScripts/DAA_RM.R
cores:
    fastp: 16 
    megahit: 128
    crossMap: 128
    concoct: 16
    metabat: 16
    maxbin: 16
    refine: 16
    reassemble: 128
    classify: 16
    gtdbtk: 128
    abundance: 128
    carveme: 16
    smetana: 16
    memote: 16
    grid: 16
    prokka: 16
    roary: 16
    diamond: 16
params:
    cutfasta: 10000
    assemblyPreset: meta-sensitive
    assemblyMin: 1000
    concoct: 400
    concoctMinLength: 350
    metabatMin: 50000
    seed: 420
    minBin: 1500
    maxbinProb: 0.9
    maxbinMinLength: 1000
    maxbinIteration: 10
    refineMem: 1600
    refineComp: 50
    refineCont: 10
    reassembleMem: 1600
    reassembleComp: 50
    reassembleCont: 10
    carveMedia: M8
    smetanaMedia: M1,M2,M3,M4,M5,M7,M8,M9,M10,M11,M13,M14,M15A,M15B,M16
    smetanaSolver: CPLEX
    roaryI: 90
    roaryCD: 90
    FVAsensitivity: 0.95
matlab: # toolboxes added to the MATLAB path by --ecgem (leave empty if already on the path)
    raven: ~/Library/Application Support/MathWorks/MATLAB Add-Ons/Collections/RAVEN Toolbox
    gecko: ~/Library/Application Support/MathWorks/MATLAB Add-Ons/Collections/GECKO Toolbox
    gurobi: /Library/gurobi1201/macos_universal2/matlab
envs:
    metagem: [path/to/metagem_env]
    metawrap: [path/to/metawrap_env]
module_envs: # module: key under envs: to 'conda activate --stack' before running it
    refinement: metawrap
    reassembly: metawrap
